name: CYBER VIGIE Omega
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
permissions:
  contents: write
concurrency:
  group: cyber-vigie
  cancel-in-progress: false
jobs:
  defensive-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Defensive integrity and secret-pattern watch
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib
          risky=[
            (re.compile(r'AKIA[0-9A-Z]{16}'),"AWS_KEY_PATTERN"),
            (re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'),"GITHUB_TOKEN_PATTERN"),
            (re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),"PRIVATE_KEY_PATTERN")
          ]
          findings=[]
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts: continue
              try: s=p.read_text(errors="ignore")
              except: continue
              for rx,label in risky:
                  if rx.search(s): findings.append({"file":str(p),"type":label})
          decision="BLOCK" if findings else "NORMAL"
          out={"schema":"CYBER_VIGIE_V2","resource":os.environ.get("GITHUB_REPOSITORY"),"decision":decision,"guardian_status":"PASS" if decision=="NORMAL" else "BLOCK","findings":findings,"cyber_iq":{"status":"MEASUREMENT_PENDING","dimensions":["DETECT","RESIST","CONTAIN","RECOVER","AUDIT"]},"rules":["DEFENSE_ONLY","UNKNOWN=HOLD","PRIVILEGE_ESCALATION=QUARANTINE","SAFETY_BYPASS=QUARANTINE"]}
          pathlib.Path("cyber-vigie.json").write_text(json.dumps(out,indent=2))
          pathlib.Path("agora").mkdir(exist_ok=True)
          pathlib.Path("agora/state.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if findings: raise SystemExit("CYBER VIGIE BLOCK: possible secret material detected")
          PY
      - name: Publish durable Cyber Vigie packet
        if: success()
        shell: bash
        run: |
          git config user.name "cerebron-cyber-vigie"
          git config user.email "actions@users.noreply.github.com"
          git add agora/state.json
          git diff --cached --quiet && exit 0
          git commit -m "CYBER VIGIE state ${GITHUB_RUN_ID}"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyber-vigie-${{ github.run_id }}
          path: cyber-vigie.json
          retention-days: 14
